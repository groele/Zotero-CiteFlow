<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Zotero CiteFlow">
  <title>Zotero CiteFlow</title>
  <desc>Circular Flow C mark symbolizing reference citation flows between Zotero and Word.</desc>
  <defs>
    <linearGradient id="cfBlueGrad" x1="26" y1="42" x2="106" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
