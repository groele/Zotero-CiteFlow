<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none" role="img" aria-label="Zotero CiteFlow">
  <title>Zotero CiteFlow</title>
  <desc>Academic citation brackets framing a lightning bolt symbolizing fast Word citation tracking and drag-and-drop citing.</desc>
  <defs>
    <linearGradient id="cfBracketLeft" x1="18" y1="22" x2="46" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cfBracketRight" x1="82" y1="22" x2="110" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="cfBoltGrad" x1="46" y1="25" x2="84" y2="103" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FACC15" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="cfSoftShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.2" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
  </defs>
  <g filter="url(#cfSoftShadow)">
    <!-- Left Academic Citation Bracket [ -->
    <path d="M 43 22 H 28 C 21 22, 18 26, 18 33 V 95 C 18 102, 21 106, 28 106 H 43" stroke="url(#cfBracketLeft)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Right Academic Citation Bracket ] -->
    <path d="M 85 22 H 100 C 107 22, 110 26, 110 33 V 95 C 110 102, 107 106, 100 106 H 85" stroke="url(#cfBracketRight)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center Citation Bolt -->
    <path d="M 72 26 L 45 68 H 64 L 56 102 L 83 60 H 64 Z" fill="url(#cfBoltGrad)" stroke="url(#cfBoltGrad)" stroke-width="4" stroke-linejoin="round" />
  </g>
</svg>
