{
  "name": "Release tag policy",
  "on": {
    "push": {
      "tags": [
        "**"
      ]
    },
    "pull_request": {
      "paths": [
        "scripts/release-tags.py",
        "docs/release-tag-policy.md",
        "docs/release-tag-migrations.json",
        ".github/workflows/tag-policy.yml",
        "package.json",
        "manifest.json"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "release_tag": {
          "description": "Optional existing canonical tag to validate with the current workflow",
          "required": false,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ inputs.release_tag || github.ref }}"
          }
        },
        {
          "name": "Check version and tag policy",
          "env": {
            "RELEASE_TAG": "${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}"
          },
          "run": "python3 scripts/release-tags.py --self-test\nif [ -n \"$RELEASE_TAG\" ]; then\n  git check-ref-format \"refs/tags/$RELEASE_TAG\"\n  git fetch --no-tags origin \"+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG\"\n  python3 scripts/release-tags.py --tag \"$RELEASE_TAG\"\nfi"
        }
      ]
    }
  }
}
